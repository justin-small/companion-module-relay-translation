name: Node CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    name: Lint, typecheck, test, validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        # Matches the runtime.type in companion/manifest.json
        uses: actions/setup-node@v7
        with:
          node-version: 18.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Validate the module against Bitfocus's own checker
        run: npm run check
      - name: Package as Companion would
        run: npm run package
